<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eby-Gold Mini</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script type="module">
  // 1. FIREBASE SETUP
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // TODO: REPLACE WITH YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.firebaseFuncs = { collection, getDocs, addDoc, deleteDoc, doc };
</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
</head>
<body class="bg-gray-50">

<!-- HEADER -->
<header class="bg-green-700 text-white p-4 sticky top-0 shadow z-10">
  <div class="flex justify-between items-center">
    <h1 class="text-xl font-bold">Eby-Gold Mini</h1>
    <div class="flex gap-3">
      <button onclick="showAdmin()" class="text-sm">⚙️ Admin</button>
      <button onclick="toggleCart()" class="relative">🛒 <span id="cart-count" class="bg-red-500 rounded-full px-2 text-xs">0</span></button>
    </div>
  </div>
</header>

<!-- PRODUCTS -->
<main class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="product-grid">Loading...</main>

<!-- CART SIDEBAR -->
<div id="cart" class="fixed right-0 top-0 h-full w-80 bg-white shadow-lg transform translate-x-full transition p-4 z-20">
  <h2 class="font-bold text-lg mb-4">Your Cart</h2>
  <div id="cart-items"></div>
  <p class="font-bold mt-4">Total: ₦<span id="cart-total">0</span></p>
  <input id="customer-email" type="email" placeholder="Your Email" class="border w-full p-2 rounded mt-2">
  <button onclick="payWithPaystack()" class="bg-green-700 text-white w-full py-2 rounded mt-4">Pay with Paystack</button>
</div>

<!-- ADMIN MODAL -->
<div id="admin" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-30">
  <div class="bg-white p-6 rounded w-96">
    <h2 class="font-bold text-lg mb-4">Add Product</h2>
    <input id="p-name" placeholder="Product Name" class="border w-full p-2 mb-2 rounded">
    <input id="p-price" type="number" placeholder="Price" class="border w-full p-2 mb-2 rounded">
    <input id="p-img" placeholder="Image URL" class="border w-full p-2 mb-2 rounded">
    <button onclick="addProduct()" class="bg-green-700 text-white w-full py-2 rounded">Save Product</button>
    <button onclick="showAdmin()" class="mt-2 w-full py-2">Close</button>
    <hr class="my-4">
    <h3 class="font-bold">Delete Products</h3>
    <div id="admin-products" class="max-h-40 overflow-y-auto"></div>
  </div>
</div>

<script>
let cart = [];
let products = [];

// 2. LOAD PRODUCTS FROM FIREBASE
async function loadProducts(){
  const { collection, getDocs } = window.firebaseFuncs;
  const querySnapshot = await getDocs(collection(window.db, "products"));
  products = [];
  querySnapshot.forEach((doc) => {
    products.push({ id: doc.id, ...doc.data() });
  });
  renderProducts();
  renderAdminProducts();
}

// RENDER PRODUCTS
function renderProducts(){
  if(products.length === 0) {
    document.getElementById('product-grid').innerHTML = "<p>Add products in Admin</p>";
    return;
  }
  document.getElementById('product-grid').innerHTML = products.map(p => `
    <div class="bg-white rounded shadow p-2">
      <img src="${p.img}" class="w-full h-32 object-cover rounded">
      <h3 class="font-semibold mt-2">${p.name}</h3>
      <p class="text-green-700 font-bold">₦${Number(p.price).toLocaleString()}</p>
      <button onclick="addToCart('${p.id}')" class="bg-green-700 text-white w-full py-1 rounded mt-2">Add to Cart</button>
    </div>
  `).join('');
}

// CART FUNCTIONS
function addToCart(id){
  let item = cart.find(i => i.id === id);
  if(item) item.qty++; else cart.push({...products.find(p=>p.id===id), qty:1});
  updateCart();
}

function updateCart(){
  document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cart-items').innerHTML = cart.map(i => `
    <div class="flex justify-between mb-2 text-sm">
      <span>${i.name} x${i.qty}</span>
      <span>₦${(i.price*i.qty).toLocaleString()}</span>
    </div>
  `).join('');
  document.getElementById('cart-total').innerText = cart.reduce((a,b)=>a+b.price*b.qty,0).toLocaleString();
}

function toggleCart(){
  document.getElementById('cart').classList.toggle('translate-x-full');
}

// 3. PAYSTACK INTEGRATION
function payWithPaystack(){
  const email = document.getElementById('customer-email').value;
  if(!email) return alert("Enter your email");
  
  let total = cart.reduce((a,b)=>a+b.price*b.qty,0) * 100; // Paystack uses kobo
  
  let handler = PaystackPop.setup({
    key: 'pk_test_YOUR_PUBLIC_KEY', // TODO: REPLACE WITH YOUR PAYSTACK PUBLIC KEY
    email: email,
    amount: total,
    currency: "NGN",
    ref: 'EBY_'+Math.floor((Math.random() * 1000000000) + 1),
    callback: function(response){
      alert('Payment successful! Ref: ' + response.reference);
      cart = [];
      updateCart();
      toggleCart();
    },
    onClose: function(){
      alert('Payment cancelled');
    }
  });
  handler.openIframe();
}

// 4. ADMIN FUNCTIONS
function showAdmin(){
  document.getElementById('admin').classList.toggle('hidden');
}

async function addProduct(){
  const { collection, addDoc } = window.firebaseFuncs;
  const name = document.getElementById('p-name').value;
  const price = document.getElementById('p-price').value;
  const img = document.getElementById('p-img').value;
  if(!name || !price) return alert("Fill name and price");
  
  await addDoc(collection(window.db, "products"), { name, price: Number(price), img: img || "https://placehold.co/200x200" });
  document.getElementById('p-name').value = "";
  document.getElementById('p-price').value = "";
  loadProducts();
}

async function renderAdminProducts(){
  const { doc, deleteDoc } = window.firebaseFuncs;
  document.getElementById('admin-products').innerHTML = products.map(p => `
    <div class="flex justify-between text-sm mb-1">
      <span>${p.name}</span>
      <button onclick="deleteProduct('${p.id}')" class="text-red-500">Delete</button>
    </div>
  `).join('');
}

async function deleteProduct(id){
  const { doc, deleteDoc } = window.firebaseFuncs;
  await deleteDoc(doc(window.db, "products", id));
  loadProducts();
}

loadProducts();
</script>
</body>
      </html>
